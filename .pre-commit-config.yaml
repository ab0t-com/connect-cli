# Secret-scanning on every commit. Install once per clone:
#   pip install pre-commit  (or: brew install pre-commit)
#   pre-commit install
# Then gitleaks runs automatically on `git commit`. CI can run:
#   pre-commit run --all-files
#
# A native git hook (.git/hooks/pre-commit) is also shipped so scanning
# works immediately without the pre-commit framework.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (block secrets)
